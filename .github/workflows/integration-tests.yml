name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  integration-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: dailymotion
        options: >-
          --health-cmd "pg_isready -U user -d dailymotion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://user:password@localhost:5432/dailymotion
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      EMAIL_FROM: no-reply@dailymotion.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pip install poetry==2.1.3

      - name: Install dependencies
        run: poetry install

      - name: Apply database schema
        run: psql $DATABASE_URL < sql/init.sql

      - name: Run integration tests
        run: poetry run pytest tests/api/ -v
